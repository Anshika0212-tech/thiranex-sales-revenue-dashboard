<title>Thiranex | Sales & Revenue Analysis Dashboard</title>

<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#132238}
.wrap{max-width:1450px;margin:auto;padding:28px}h1{margin:0;font-size:30px}.sub{color:#667085;margin:7px 0 18px}
.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.filter{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px}
.filter label{display:block;font-size:10px;font-weight:bold;color:#667085;margin-bottom:5px}
select{width:100%;padding:8px;border:1px solid #d7dee8;border-radius:7px;background:white}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.card,.panel,.insights{background:white;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 2px 8px rgba(15,23,42,.05)}
.card{padding:15px}.label{font-size:10px;color:#667085;font-weight:bold}.value{font-size:23px;font-weight:700;margin-top:7px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}.panel{padding:8px;min-height:350px}
.insights{margin-top:14px;padding:20px}li{margin:9px 0;color:#475467}
@media(max-width:1050px){.filters{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}
@media(max-width:600px){.wrap{padding:14px}.filters{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}}
</style></head>

<h1>Sales & Revenue Analysis Dashboard</h1>
<div class="sub">Executive overview • KPI tracking • Data visualization • Interactive business insights</div>

<div class="filters">
<div class="filter"><label>PROGRAM</label><select id="program" onchange="update()"><option>All</option><option value="Full Stack Web Development">Full Stack Web Development</option><option value="Python Development">Python Development</option><option value="Data Analytics">Data Analytics</option><option value="Data Science">Data Science</option><option value="AI &amp; Machine Learning">AI &amp; Machine Learning</option><option value="Generative AI / LLMs">Generative AI / LLMs</option><option value="Cyber Security">Cyber Security</option><option value="UI/UX Design">UI/UX Design</option><option value="Digital Marketing">Digital Marketing</option><option value="Web Development">Web Development</option><option value="App Development">App Development</option><option value="Cloud Computing / AWS">Cloud Computing / AWS</option><option value="Business Analyst">Business Analyst</option><option value="Tableau &amp; Power BI Visualization">Tableau &amp; Power BI Visualization</option><option value="DevOps &amp; CI/CD">DevOps &amp; CI/CD</option></select></div>
<div class="filter"><label>ACQUISITION CHANNEL</label><select id="channel" onchange="update()"><option>All</option><option value="Website">Website</option><option value="Instagram">Instagram</option><option value="LinkedIn">LinkedIn</option><option value="Referral">Referral</option><option value="College / Community">College / Community</option></select></div>
<div class="filter"><label>STATE</label><select id="state" onchange="update()"><option>All</option><option value="Delhi">Delhi</option><option value="Gujarat">Gujarat</option><option value="Karnataka">Karnataka</option><option value="Kerala">Kerala</option><option value="Maharashtra">Maharashtra</option><option value="Rajasthan">Rajasthan</option><option value="Tamil Nadu">Tamil Nadu</option><option value="Telangana">Telangana</option><option value="Uttar Pradesh">Uttar Pradesh</option><option value="West Bengal">West Bengal</option></select></div>
<div class="filter"><label>PAYMENT STATUS</label><select id="payment" onchange="update()"><option>All</option><option value="Paid">Paid</option><option value="Pending">Pending</option><option value="Free">Free</option></select></div>
<div class="filter"><label>COMPLETION STATUS</label><select id="completion" onchange="update()"><option>All</option><option value="Completed">Completed</option><option value="In Progress">In Progress</option><option value="Not Started">Not Started</option></select></div>
</div>

<div class="cards">
<div class="card"><div class="label">NET REVENUE</div><div class="value" id="rev">₹0</div></div>
<div class="card"><div class="label">ORDERS</div><div class="value" id="orders">0</div></div>
<div class="card"><div class="label">AVERAGE ORDER VALUE</div><div class="value" id="aov">₹0</div></div>
<div class="card"><div class="label">PAID ORDERS</div><div class="value" id="paid">0</div></div>
<div class="card"><div class="label">REFUND VALUE</div><div class="value" id="refund">₹0</div></div>
<div class="card"><div class="label">COMPLETION RATE</div><div class="value" id="completionRate">0%</div></div>
</div>

<div class="grid">
<div class="panel"><div id="trend"></div></div>
<div class="panel"><div id="programChart"></div></div>
<div class="panel"><div id="channelChart"></div></div>
<div class="panel"><div id="completionChart"></div></div>
</div>

<div class="insights"><h2>Business Insight Generation</h2><ul id="insights"></ul></div>
</div>

const common={responsive:true,displayModeBar:false};
function filtered(){
 const p=document.getElementById('program').value,c=document.getElementById('channel').value,
 s=document.getElementById('state').value,ps=document.getElementById('payment').value,
 co=document.getElementById('completion').value;
 return data.filter(r=>(p==='All'||r.program===p)&&(c==='All'||r.channel===c)&&(s==='All'||r.state===s)&&(ps==='All'||r.payment===ps)&&(co==='All'||r.completion===co));
}
function money(n){return '₹'+Math.round(n).toLocaleString('en-IN')}
function update(){
 const d=filtered(), net=d.reduce((a,r)=>a+Math.max(0,r.amount-r.discount-r.refund),0),
 orders=d.length,aov=orders?net/orders:0,paid=d.filter(r=>r.payment==='Paid').length,
 refund=d.reduce((a,r)=>a+r.refund,0),completed=d.filter(r=>r.completion==='Completed').length;
 document.getElementById('rev').textContent=money(net);
 document.getElementById('orders').textContent=orders.toLocaleString('en-IN');
 document.getElementById('aov').textContent=money(aov);
 document.getElementById('paid').textContent=paid.toLocaleString('en-IN');
 document.getElementById('refund').textContent=money(refund);
 document.getElementById('completionRate').textContent=(orders?completed/orders*100:0).toFixed(1)+'%';

 let months={};
 d.forEach(r=>{let m=r.date.slice(0,7);months[m]=(months[m]||0)+Math.max(0,r.amount-r.discount-r.refund)});
 let mx=Object.keys(months).sort();
 Plotly.react('trend',[{x:mx,y:mx.map(x=>months[x]),type:'scatter',mode:'lines+markers'}],{title:'Monthly Net Revenue Trend',margin:{t:50,l:55,r:15,b:45},paper_bgcolor:'white',plot_bgcolor:'white',yaxis:{gridcolor:'#e2e8f0'}},common);

 let prog={};d.forEach(r=>prog[r.program]=(prog[r.program]||0)+Math.max(0,r.amount-r.discount-r.refund));
 let pk=Object.keys(prog).sort((a,b)=>prog[b]-prog[a]).slice(0,8);
 Plotly.react('programChart',[{x:pk.map(x=>prog[x]),y:pk,type:'bar',orientation:'h'}],{title:'Top Programs by Revenue',margin:{t:50,l:150,r:15,b:40},paper_bgcolor:'white',plot_bgcolor:'white',xaxis:{gridcolor:'#e2e8f0'}},common);

 let ch={};d.forEach(r=>ch[r.channel]=(ch[r.channel]||0)+Math.max(0,r.amount-r.discount-r.refund));
 Plotly.react('channelChart',[{x:Object.keys(ch),y:Object.values(ch),type:'bar'}],{title:'Revenue by Acquisition Channel',margin:{t:50,l:55,r:15,b:75},paper_bgcolor:'white',plot_bgcolor:'white'},common);

 let st={};d.forEach(r=>st[r.completion]=(st[r.completion]||0)+1);

   '<li><b>Top revenue program:</b> '+top+' at '+money(topVal)+'.</li>',
